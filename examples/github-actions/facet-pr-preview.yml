# Copy this file to `.github/workflows/facet-pr-preview.yml` in your repository.
#
# Required repository configuration:
#   - Secret:   FACET_PREVIEW_SECRET  (shared HMAC-SHA256 preview signing secret)
#   - Variable: FACET_SITE_URL        (e.g. https://www.example.com)
#   - Optional: FACET_CONFIG_PATH     (defaults to facet.yaml)
#
# Security:
#   - Triggered on `pull_request` (never `pull_request_target`) so untrusted fork
#     PRs cannot access repository secrets.
#   - Uses least-privilege permissions (`contents: read`, `pull-requests: write`).

name: Facet PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "facet.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-preview:
    name: Validate & Post Preview Links
    runs-on: ubuntu-latest
    # Skip fork PRs where repository secrets are unavailable.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract base branch facet.yaml
        id: base-config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FACET_CONFIG: ${{ vars.FACET_CONFIG_PATH || 'facet.yaml' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "${BASE_SHA}:${FACET_CONFIG}" 2>/dev/null; then
            git show "${BASE_SHA}:${FACET_CONFIG}" > /tmp/facet-base.yaml
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate facet.yaml and generate PR preview comment
        env:
          FACET_CONFIG: ${{ vars.FACET_CONFIG_PATH || 'facet.yaml' }}
          FACET_SITE_URL: ${{ vars.FACET_SITE_URL }}
          FACET_PREVIEW_SECRET: ${{ secrets.FACET_PREVIEW_SECRET }}
          HAS_BASE: ${{ steps.base-config.outputs.has_base }}
        run: |
          if [ -z "$FACET_SITE_URL" ]; then
            echo "::error::Missing repository variable FACET_SITE_URL (e.g. https://www.example.com)."
            exit 1
          fi
          if [ -z "$FACET_PREVIEW_SECRET" ]; then
            echo "::error::Missing repository secret FACET_PREVIEW_SECRET."
            exit 1
          fi

          if [ "$HAS_BASE" = "true" ]; then
            npx --yes @facet/cli pr-comment "$FACET_CONFIG" \
              --url "$FACET_SITE_URL" \
              --base /tmp/facet-base.yaml \
              --ttl 604800 > /tmp/facet-pr-comment.md
          else
            npx --yes @facet/cli pr-comment "$FACET_CONFIG" \
              --url "$FACET_SITE_URL" \
              --ttl 604800 > /tmp/facet-pr-comment.md
          fi

      - name: Create or update sticky PR preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- facet-pr-preview -->";
            const body = fs.readFileSync("/tmp/facet-pr-comment.md", "utf8");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
