# Facet configuration for the Meridian Cloud example site (v0.2 features).
# Validate locally:  npx facet validate examples/basic-site/facet.yaml
# Preview locally:   npx facet preview --target http://127.0.0.1:4000 --config examples/basic-site/facet.yaml

version: 1

settings:
  # First-party cookie storing the visitor's sticky deterministic bucketing ID
  cookieName: "__facet_vid"
  # First-party cookie storing session-sticky matches and attribution signals
  stickyCookieName: "__facet_sticky"
  # Query parameters used for HMAC-signed shareable production preview links
  previewParam: "__facet_preview"
  previewSigParam: "__facet_sig"

  # Emit minimal exposure metadata ({ experience_id, bucket }) to your existing analytics
  analytics:
    providers: ["ga4", "umami", "posthog"]

  # Optional BYOK reverse-IP / CRM enrichment guardrails (always fail-open)
  enrichment:
    timeoutMs: 150
    cacheTtlSeconds: 3600

  # Reusable named HTML slots referenced by `slot:` in experience changes
  slots:
    stripe-logos: >-
      <div class="logo-row" aria-label="Payments & fintech customers">
        <span class="logo-pill">Stripe Partner Ready</span>
        <span class="logo-pill">SOC 2 Type II</span>
        <span class="logo-pill">PCI-DSS Level 1</span>
        <span class="logo-pill">99.995% SLA</span>
      </div>
    fintech-logos: >-
      <div class="logo-row" aria-label="Fintech teams using Meridian">
        <span class="logo-pill">Ramp</span>
        <span class="logo-pill">Mercury</span>
        <span class="logo-pill">Brex</span>
        <span class="logo-pill">Plaid</span>
      </div>
    eu-compliance-badge: >-
      <span>EU Data Residency &middot; Frankfurt &amp; Dublin Regions</span>

# Inline data lookup tables for scalable 1:1 ABM experiences (also loadable via parseCsvTable)
data:
  accounts:
    stripe:
      name: "Stripe"
      team: "infrastructure"
      headline: "Zero-latency edge routing built for Stripe's global scale"
      subhead: "See how Meridian pairs with global payment rails to cut p99 checkout latency by 38% with deterministic failover."
      cta: "Open Stripe's architecture walkthrough"
      logoSlot: "stripe-logos"
    plaid:
      name: "Plaid"
      team: "platform"
      headline: "Resilient API edge infrastructure built for Plaid"
      subhead: "Keep high-throughput financial data connections fast and compliant across 300+ global PoPs."
      cta: "Explore Plaid's edge benchmark"
      logoSlot: "fintech-logos"
    ramp:
      name: "Ramp"
      team: "engineering"
      headline: "Predictable global routing for Ramp's finance platform"
      subhead: "Ship real-time card authorization and spend-control workloads with sub-20ms edge failover."
      cta: "Book Ramp's live walkthrough"
      logoSlot: "fintech-logos"

experiences:
  # 1. Virtual 1:1 ABM Account Page (`/for/:acct` -> fetches `/` from origin, sticky for 7 days)
  # Test: http://127.0.0.1:8787/for/stripe  or  http://127.0.0.1:8787/for/plaid
  - id: abm-account-page
    name: "1:1 ABM Virtual Account Page"
    priority: 100
    stopOnMatch: true
    holdout: 0
    originPath: "/"
    sticky: "7d"
    match:
      path: "/for/:acct"
    lookup:
      table: "accounts"
      key: "{{params.acct}}"
      required: true
    changes:
      - selector: "[data-facet-slot='hero-eyebrow']"
        text: 'Prepared for the {{data.name}} {{data.team | default("engineering")}} team'
      - selector: "h1"
        text: '{{data.headline | default("Edge infrastructure built for your team")}}'
      - selector: "[data-facet-slot='hero-subhead']"
        text: '{{data.subhead | default("Deploy APIs and edge routing in 300+ cities with deterministic failover.")}}'
      - selector: "[data-cta='hero']"
        text: '{{data.cta | default("Book a tailored demo")}}'
        attrs:
          href: "/demo?acct={{params.acct}}"
      - selector: "#logo-strip"
        slot: '{{data.logoSlot | default("fintech-logos")}}'

  # 2. 1:1 ABM Query Link (`/?acct=stripe`, sticky for 7 days across subsequent navigation)
  # Test: http://127.0.0.1:8787/?acct=stripe  or  http://127.0.0.1:8787/?acct=ramp
  - id: abm-query-account
    name: "1:1 ABM Query Account Experience"
    priority: 90
    stopOnMatch: true
    holdout: 0
    sticky: "7d"
    match:
      path: "/"
      query.acct:
        exists: true
    lookup:
      table: "accounts"
      key: "{{query.acct}}"
      required: true
    changes:
      - selector: "[data-facet-slot='hero-eyebrow']"
        text: 'Prepared for the {{data.name}} {{data.team | default("engineering")}} team'
      - selector: "h1"
        text: '{{data.headline | default("Edge infrastructure built for your team")}}'
      - selector: "[data-facet-slot='hero-subhead']"
        text: '{{data.subhead | default("Deploy APIs and edge routing in 300+ cities with deterministic failover.")}}'
      - selector: "[data-cta='hero']"
        text: '{{data.cta | default("Book a tailored demo")}}'
        attrs:
          href: "/demo?acct={{query.acct}}"
      - selector: "#logo-strip"
        slot: '{{data.logoSlot | default("fintech-logos")}}'

  # 3. Paid Ad Message-Match + Optional BYOK Company Industry Rule (sticky for 7 days)
  # Test: http://127.0.0.1:8787/?utm_campaign=fintech-q4
  - id: fintech-abm
    name: "Fintech Paid Search & ABM"
    priority: 50
    stopOnMatch: true
    holdout: 0.2 # Deterministic 20% sticky control group to measure real conversion lift
    sticky: "7d"
    match:
      path: "/"
      any:
        - utm_campaign: ["fintech-q4", "abm-banking", "pci-infra"]
        - utm_term:
            contains: "fintech"
        - company.industry: ["Financial Services", "FinTech"]
    changes:
      - selector: "[data-facet-slot='hero-eyebrow']"
        text: "Built for regulated fintech teams"
      - selector: "h1"
        text: "Compliance-ready infrastructure for fintech teams"
      - selector: "[data-facet-slot='hero-subhead']"
        text: "Launch SOC 2 and PCI-ready ledger workloads in days, not quarters — with immutable audit logs at the edge."
      - selector: "[data-cta='hero']"
        text: "See the fintech demo"
        attrs:
          href: "/demo?segment=fintech"
      - selector: "#logo-strip"
        slot: "fintech-logos"

  # 4. Geo + Returning-Visitor Rule (built-in edge signals, zero API keys)
  # Test in Preview Bar by selecting "eu-returning-visitor"
  - id: eu-returning-visitor
    name: "EU Returning Visitor Message"
    priority: 10
    stopOnMatch: true
    holdout: 0.1
    match:
      path: "/"
      all:
        - returning: true
        - geo.continent: "EU"
    changes:
      - selector: "[data-facet-slot='hero-eyebrow']"
        slot: "eu-compliance-badge"
        addClass: ["eyebrow--eu"]
      - selector: "h1"
        text: "Welcome back — EU data residency without the latency tax"
      - selector: "[data-facet-slot='hero-subhead']"
        text: "Keep customer telemetry inside Frankfurt and Dublin regions with native GDPR controls and zero origin rewrites."
      - selector: "[data-cta='hero']"
        text: "Continue your EU evaluation"
        attrs:
          href: "/demo?region=eu&returning=1"
